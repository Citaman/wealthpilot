<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WealthPilot</title>
  <link rel="stylesheet" href="./workspace.css">
  <script src="./assets/lucide.min.js" defer></script>
  <script src="./assets/echarts.min.js" defer></script>
  <script src="./assets/papaparse.min.js" defer></script>
  <script src="./assets/jszip.min.js" defer></script>
  <script src="./domain.js" defer></script>
  <script src="./workspace.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="brandbar"><a href="#today" class="brand" aria-label="WealthPilot, accueil"><span class="brandmark" aria-hidden="true">w.</span>wealthpilot</a><div class="brand-actions"><span id="data-label" class="badge"></span><button class="icon-button" data-action="privacy" title="Masquer les montants" aria-label="Masquer les montants" aria-pressed="false"><i data-lucide="eye"></i></button><button class="icon-button" data-action="import" title="Importer un relevé" aria-label="Importer un relevé"><i data-lucide="file-up"></i></button></div></header>
  <main id="main" tabindex="-1"></main>
  <div class="bottom-bar">
    <div class="scope-control"><i data-lucide="users" aria-hidden="true"></i><label class="sr-only" for="scope">Comptes affichés</label><select id="scope"></select></div>
    <nav id="dock" aria-label="Navigation principale"></nav>
    <button class="icon-button dock-more" id="more-trigger" aria-label="Comptes et données" title="Comptes et données" aria-expanded="false" aria-controls="more-menu"><i data-lucide="sliders-horizontal"></i></button>
  </div>
  <div id="more-menu" class="more-menu" hidden><a href="#sharing"><i data-lucide="users"></i>Qui paie quoi</a><a href="#recurring"><i data-lucide="repeat-2"></i>Récurrents</a><a href="#accounts"><i data-lucide="wallet"></i>Comptes</a><a href="#import"><i data-lucide="file-up"></i>Importer un relevé</a><a href="#settings"><i data-lucide="settings-2"></i>Foyer et sauvegardes</a></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <input type="file" id="restore-file" accept="application/json,.json" hidden>
</body>
</html>
